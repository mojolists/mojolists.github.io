# ticketmaster-shows.yml
# ----------------------
# Runs on the 1st of each month at 8 AM UTC.
# Pulls live music events from the Ticketmaster Discovery API for:
#   • Austin, TX  (city-wide)
#   • San Antonio, TX  (city-wide)
#   • Mission Ballroom, Denver  (venue ID)
#   • Red Rocks Amphitheatre  (venue ID)
#
# Required repo secrets (Settings → Secrets → Actions):
#   MOJO_PAT   — GitHub PAT with repo scope
#   TM_API_KEY — Ticketmaster Discovery API key
#                Get one free at: https://developer.ticketmaster.com
#                (takes ~2 minutes, no credit card needed)

name: Ticketmaster Pull (Monthly)

on:
  schedule:
    # 8:00 AM UTC on the 1st of each month
    - cron: '0 8 1 * *'
  workflow_dispatch:    # allow manual trigger from Actions tab

jobs:
  ticketmaster:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MOJO_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run Ticketmaster pull
        env:
          GITHUB_TOKEN: ${{ secrets.MOJO_PAT }}
          GITHUB_REPO:  ${{ github.repository }}
          TM_API_KEY:   ${{ secrets.TM_API_KEY }}
        run: python scripts/fetch_ticketmaster.py

      # fetch_ticketmaster.py writes directly to GitHub via the Contents API.
