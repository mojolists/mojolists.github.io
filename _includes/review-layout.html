<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ artist }} - {{ album }} | MojoLists</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1120; font-family: 'Inter', sans-serif; color: #f8fafc; }
        .serif { font-family: 'Cormorant Garamond', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; }
        .mojo-rating-box { background: transparent; }
        .gold-button { border: 1px solid #d4af37; color: #d4af37; transition: all 0.3s ease; }
        .gold-button:hover { background: #d4af37; color: #0b1120; }
        .motto-text { font-family: 'Cormorant Garamond', serif; font-style: italic; }
        .text-mojo-red { color: #e11d48; }
        .nav-link { font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; color: #94a3b8; transition: color 0.3s ease; }
        .nav-link:hover { color: #d4af37; }
    </style>
</head>
<body class="antialiased">

    <header class="py-12 text-center">
        <nav class="mb-8 space-x-8">
            <a href="/" class="nav-link">The Reviews</a>
            <a href="/about" class="nav-link">About</a>
        </nav>
        <a href="/" class="inline-block no-underline">
            <h1 class="serif text-6xl tracking-widest uppercase mb-4 text-white">MojoLists</h1>
        </a>
        <p class="motto-text text-xl">
            <span class="text-white">The Favored Home of Crate Diggers,</span> 
            <span class="text-mojo-red">Vinyl Flippers and Music Lovers</span>
        </p>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            
            <div class="lg:col-span-5 space-y-8">
                <div class="glass-card p-2">
                    <img src="/reviews/{{ art }}" alt="{{ album }}" class="w-full rounded-lg shadow-2xl">
                </div>
                
                <div class="mojo-rating-box p-6 text-center">
                    <h3 class="serif text-2xl uppercase tracking-tighter mb-2">Mojo Rating</h3>
                    <div class="text-7xl font-bold serif text-white">{{ mojo }}%</div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <a href="{{ stream }}" class="gold-button py-3 text-center rounded-sm uppercase text-sm tracking-widest font-semibold">Listen</a>
                    <a href="{{ buy }}" class="gold-button py-3 text-center rounded-sm uppercase text-sm tracking-widest font-semibold">Buy Vinyl</a>
                </div>
            </div>

            <div class="lg:col-span-7">
                <div class="mb-8">
                    <h2 class="serif text-5xl mb-2">{{ artist }}</h2>
                    <h3 class="text-2xl text-slate-400 font-light italic">{{ album }}</h3>
                </div>

                <div class="prose prose-invert max-w-none text-slate-300 leading-relaxed text-lg">
                    {{ content | safe }}
                </div>

                {% if youtube %}
                <div class="mt-12 glass-card p-4">
                    <div class="aspect-w-16 aspect-h-9">
                        <iframe src="https://www.youtube.com/embed/{{ youtube }}" class="w-full h-80 rounded-md" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
                {% endif %}
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-800 py-12 text-center text-slate-500 text-sm">
        <p>&copy; 2026 MojoLists. All Analog Rights Reserved.</p>
    </footer>

</body>
</html>
