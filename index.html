<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojoLists | The Soul Of The Sound</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Playfair+Display:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b1120; }
        .serif { font-family: 'Playfair Display', serif; }
        .logo-font { font-family: 'Cormorant Garamond', serif; }
        
        :root {
            --mojo-gold: #c5a059;
            --mojo-red: #ef4444;
        }

        .nav-link { transition: color 0.4s ease; color: #94a3b8; }
        .nav-link:hover { color: var(--mojo-gold) !important; }
        .nav-active { color: #ffffff; }

        .review-card {
            background-color: #161e2e;
            border: 1px solid #1e293b;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .review-card:hover .artist-title { color: var(--mojo-gold); }
        .review-card:hover .album-subtitle { color: var(--mojo-gold); }
        .review-card:hover { border-color: rgba(197, 160, 89, 0.4); }

        .img-container {
            background-color: #0f172a;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .review-card:hover .card-img { transform: scale(1.08); }

        /* Label styling for the top row */
        .row-label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--mojo-red);
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
