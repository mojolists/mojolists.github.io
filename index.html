<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mojolists</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #000;
            color: #fff;
        }
        
        .header {
            position: relative;
            height: 500px;
            background-image: url('img/lifestyle-bd.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(1px); /* Slightly unfocused as requested */
            display: flex;
            flex-direction: column;
        }
        
        .logo-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        .logo {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 4rem;
            letter-spacing: 3px;
        }
        
        .logo span:nth-child(1) {
            color: white;
        }
        
        .logo span:nth-child(2) {
            color: #ff0000;
        }
        
        .nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 0;
            text-align: center;
        }
        
        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        
        .nav a:hover {
            color: gold;
        }
        
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .teaser-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 30px;
        }
        
        .teaser {
            background: #1a1a1a;
            border: 1px solid #ff0000;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .teaser:hover {
            transform: translateY(-5px);
            border-color: gold;
        }
        
        .teaser img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 2px solid #ff0000;
        }
        
        .teaser h3 {
            color: gold;
            margin: 15px 0;
        }
        
        .teaser p {
            color: #ccc;
            font-size: 0.9rem;
        }
        
        .accent-red {
            color: #ff0000;
        }
        
        .accent-gold {
            color: gold;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <h1 class="logo">
                <span>MOJO</span>
                <span>LISTS</span>
            </h1>
        </div>
        <div class="nav">
            <a href="#reviews">Reviews</a>
            <a href="#hardware">Hardware</a>
        </div>
    </div>
    
    <div class="content">
        <div class="teaser-grid">
            <div class="teaser">
                <img src="img/review1.jpg" alt="Review Teaser 1">
                <h3>Review Title 1</h3>
                <p>Short description of the review content.</p>
            </div>
            <div class="teaser">
                <img src="img/review2.jpg" alt="Review Teaser 2">
                <h3>Review Title 2</h3>
                <p>Short description of the review content.</p>
            </div>
            <div class="teaser">
                <img src="img/review3.jpg" alt="Review Teaser 3">
                <h3>Review Title 3</h3>
                <p>Short description of the review content.</p>
            </div>
        </div>
    </div>
</body>
</html>
